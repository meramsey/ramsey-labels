name: Manually build reviewed candidate (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gates:
    uses: ./.github/workflows/ci.yml
  candidate:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - run: python3 bin/build.py
      - run: python3 bin/build-public.py
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: reviewed-candidate-${{ github.sha }}
          path: |
            build/*.zip
            build/*.zip.sha256
            build/artifact-manifest.json
            build/public/*.zip
            build/public/*.zip.sha256
            build/public/artifact-manifest.json
          if-no-files-found: error
