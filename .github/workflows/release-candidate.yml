name: Manually build reviewed candidate (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gates:
    uses: ./.github/workflows/ci.yml
  candidate:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: python3 bin/build.py
      - run: python3 bin/build-public.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewed-candidate-${{ github.sha }}
          path: |
            build/*.zip
            build/*.zip.sha256
            build/artifact-manifest.json
            build/public/*.zip
            build/public/*.zip.sha256
            build/public/artifact-manifest.json
          if-no-files-found: error
