name: Manually build reviewed candidate (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gates:
    uses: ./.github/workflows/ci.yml
  candidate:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: python3 bin/build.py
      - run: python3 bin/build-public.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-candidate-${{ github.sha }}
          path: |
            build/*.zip
            build/*.zip.sha256
            build/artifact-manifest.json
            build/public/*.zip
            build/public/*.zip.sha256
            build/public/artifact-manifest.json
          if-no-files-found: error
