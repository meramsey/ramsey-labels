name: Approved release preparation
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Approved release version (must match plugin metadata)'
        required: true
        type: string
      approval:
        description: 'Type PREPARE to generate gated release artifacts; publication remains disabled'
        required: true
        type: string
permissions:
  contents: read
  attestations: write
  id-token: write
  actions: read
jobs:
  prepare:
    if: inputs.approval == 'PREPARE'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false, ref: "${{ github.ref }}" }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: test "$(node -p "require('./package.json').version")" = "${{ inputs.version }}"
      - run: bin/release-supply-chain.sh
      - name: Scan exact release artifacts
        run: |
          mkdir -p build/release/reports
          docker run --rm -v "$PWD/build:/build:ro" -v "$PWD/build/release/reports:/reports" aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            fs --format json --output /reports/trivy-release.json /build
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            build/ramsey-labels-independent-*.zip
            build/public/ramsey-labels-*.zip
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: approved-release-preparation-${{ github.sha }}
          path: |
            build/release/
            build/ramsey-labels-independent-*.zip
            build/ramsey-labels-independent-*.zip.sha256
            build/artifact-manifest.json
            build/public/ramsey-labels-*.zip
            build/public/ramsey-labels-*.zip.sha256
            build/public/artifact-manifest.json
          retention-days: 90
          if-no-files-found: error
