name: Quality and release gates
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - name: Validate submitted commit identity history
        env:
          RLI_EXPECTED_GIT_NAME: Michael Ramsey
          RLI_EXPECTED_GIT_EMAIL: mike@hackerdise.me
          RLI_IDENTITY_RANGE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash bin/check-git-identity.sh --commit-range "$RLI_IDENTITY_RANGE"
      - name: Regenerate and verify gettext catalog
        run: |
          cp languages/ramsey-labels-independent.pot /tmp/ramsey-labels.pot
          npm run i18n:pot
          python3 bin/compare-pot.py /tmp/ramsey-labels.pot languages/ramsey-labels-independent.pot
      - run: npm audit --audit-level=low
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - run: docker run --rm -v "$PWD:/app" -w /app composer:2.8.12 install --no-interaction --prefer-dist
      - name: Syntax, PHPUnit and static analysis
        run: |
          docker run --rm -v "$PWD:/app" -w /app composer:2.8.12 sh -ec 'for file in includes/*.php ramsey-labels-independent.php public/src/ramsey-labels.php uninstall.php; do php -l "$file"; done; vendor/bin/phpunit --do-not-cache-result; vendor/bin/phpstan analyse --memory-limit=1G'
      - name: Full WordPress Coding Standards (blocking, no baseline)
        run: docker run --rm -v "$PWD:/app" -w /app composer:2.8.12 vendor/bin/phpcs
      - run: docker run --rm -v "$PWD:/app" -w /app composer:2.8.12 audit
  integration-browser-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - php: '8.3'
            wordpress-image: wordpress:7.1.4-php8.3-apache
            cli-image: wordpress:cli-2.12.0-php8.3
          - php: '8.5'
            wordpress-image: wordpress:7.1.4-php8.5-apache@sha256:63f89c89eeba29421a2660ccc87be392e6d72148724d92fa3d0756e9700786b9
            cli-image: wordpress:cli-php8.5@sha256:a290226b2645cbd4aaad47abcaf72864656117b4d4f06d6789615464f58d2a50
    env:
      WP_IMAGE: ${{ matrix.wordpress-image }}
      CLI_IMAGE: ${{ matrix.cli-image }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y imagemagick poppler-utils librsvg2-bin
      - run: npx playwright install --with-deps chromium
      - run: npx playwright install --with-deps firefox webkit
      - run: docker compose up -d --wait wordpress
      - run: bash bin/setup-test-site.sh
      - run: docker run --rm -v "$PWD:/app" -w /app composer:2.8.12 install --no-interaction --prefer-dist
      - run: docker compose exec -T -w /var/www/html/wp-content/plugins/ramsey-labels-independent wordpress php vendor/bin/phpunit --do-not-cache-result
      - run: bash bin/integration.sh
      - name: Legacy order storage
        run: |
          docker compose run --rm cli wp option update woocommerce_custom_orders_table_enabled no
          bash bin/integration.sh
      - name: HPOS order storage
        run: |
          docker compose run --rm cli wp option update woocommerce_custom_orders_table_enabled yes
          bash bin/integration.sh
      - run: bash bin/upgrade-test.sh
      - run: bash bin/lifecycle-test.sh
      - run: bash bin/multisite-test.sh
      - run: CHROME_PATH="$(node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())")" npm run test:e2e
      - run: npm run test:e2e:firefox
      - run: npm run test:e2e:webkit
      - run: node bin/check-pdf.cjs
      - name: Reproducible allowlisted release candidate
        run: |
          python3 bin/build.py
          cp build/*.zip.sha256 build/first.sha256
          python3 bin/build.py
          cmp build/first.sha256 build/*.zip.sha256
      - name: Check packaged production files, not developer tree
        run: bash bin/check-package.sh
      - name: Build independently branded directory candidate and test RC9 path migration
        run: |
          python3 bin/build-public.py
          cp build/public/*.zip.sha256 build/public-first.sha256
          python3 bin/build-public.py
          cmp build/public-first.sha256 build/public/*.zip.sha256
          bash bin/check-public-migration.sh
      - if: always()
        run: |
          docker compose stop || true
          COMPOSE_PROJECT_NAME=ramsey-labels-multisite-test docker compose -f compose.multisite.yaml stop || true
          COMPOSE_PROJECT_NAME=ramsey-labels-package-test docker compose -f compose.package.yaml stop || true
          COMPOSE_PROJECT_NAME=ramsey-labels-public-migration docker compose -f compose.package.yaml stop || true
  oldest-supported:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: ramsey-labels-oldest-test
      WP_IMAGE: wordpress:6.0-php7.4-apache
      CLI_IMAGE: wordpress:cli-2.7.1-php7.4
      TEST_PORT: '18886'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y imagemagick poppler-utils librsvg2-bin
      - run: npx playwright install --with-deps chromium
      - run: docker compose up -d --wait wordpress
      - run: docker compose run --rm cli wp core install --url=http://127.0.0.1:18886 --title='Synthetic Labels Test' --admin_user=labels_admin --admin_password=local-test-only-password --admin_email=labels@example.test --skip-email
      - run: docker compose run --rm cli wp plugin install woocommerce --version=7.0.1 --activate
      - run: docker compose run --rm cli wp plugin activate ramsey-labels-independent
      - run: docker run --rm -v "$PWD:/app" -w /app composer:2.8.12 install --no-interaction --prefer-dist
      - run: docker compose exec -T -w /var/www/html/wp-content/plugins/ramsey-labels-independent wordpress php vendor/bin/phpunit --do-not-cache-result
      - run: bash bin/integration.sh
      - run: bash bin/upgrade-test.sh
      - run: bash bin/lifecycle-test.sh
      - run: CHROME_PATH="$(node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())")" npm run test:e2e
      - if: always()
        run: docker compose stop
  security-license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: python3 bin/check-licenses.py
      - name: Scan all recoverable history for secrets
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 git /repo --redact --no-banner
