name: ramsey-labels-test
services:
  db:
    image: mariadb:11.4.5
    environment:
      MARIADB_ROOT_PASSWORD: synthetic-local-only
      MARIADB_DATABASE: labels_test
      MARIADB_USER: labels_test
      MARIADB_PASSWORD: synthetic-local-only
    volumes: ["database:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 40
  wordpress:
    image: ${WP_IMAGE:-wordpress:7.1.4-php8.3-apache}
    ports: ["127.0.0.1:${TEST_PORT:-18885}:80"]
    environment: &wp
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: labels_test
      WORDPRESS_DB_USER: labels_test
      WORDPRESS_DB_PASSWORD: synthetic-local-only
      WORDPRESS_CONFIG_EXTRA: "define('WP_ENVIRONMENT_TYPE', 'local');"
    volumes:
      - wordpress:/var/www/html
      - ./:/var/www/html/wp-content/plugins/ramsey-labels-independent:ro
    depends_on:
      db: {condition: service_healthy}
  cli:
    image: ${CLI_IMAGE:-wordpress:cli-2.12.0-php8.3}
    user: "33:33"
    environment: *wp
    volumes:
      - wordpress:/var/www/html
      - ./:/var/www/html/wp-content/plugins/ramsey-labels-independent:ro
    depends_on: [wordpress]
    profiles: [tools]
volumes:
  database:
  wordpress:
